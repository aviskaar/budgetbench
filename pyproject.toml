[project]
name = "budgetbench"
version = "0.1.0"
description = "A pilot evaluation protocol and harness for comparing local-LLM memory strategies under fixed active-context budgets"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "datasets>=2.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
budgetbench = "budgetbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
