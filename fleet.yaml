project:
  name: budgetbench
  gateway:
    provider: litellm
    host: 127.0.0.1
    port: 4000
    master_key_env: LITELLM_MASTER_KEY

nodes:
  local-mac:
    endpoint: http://localhost:11434
    tags:
           - controller
           - local
           - macbook
  m4-mini-64g:
    endpoint: http://192.168.40.69:11434
    tags:
           - remote
           - gpu
           - workhorse
           - m4-mini
  m4-mini-16g:
    endpoint: http://192.168.40.59:11434
    tags:
           - remote
           - gpu
           - small-memory
           - m4-mini

models:
     # Workhorse — largest coding model, 256k context
  heavy-coder:
    node: m4-mini-64g
    ollama_model: qwen3-coder:latest
    litellm_alias: qwen3-coder-30b-mini
    context: 262144
    timeout: 1800
    max_parallel: 1

     # Heavy coding fallback on local MacBook, 32k context
  heavy-coder-local:
    node: local-mac
    ollama_model: qwen3.6:35b-mlx
    litellm_alias: qwen3.6-35b-local
    context: 32768
    timeout: 600
    max_parallel: 1

     # Planning — small model on M4 Mini (64GB), 128k context
  small-coder:
    node: m4-mini-64g
    ollama_model: qwen3.5:27b
    litellm_alias: qwen3.5-27b-mini
    context: 131072
    timeout: 300
    max_parallel: 2

     # Quick summaries — tiny model on M4 Mini (64GB)
  tiny-coder:
    node: m4-mini-64g
    ollama_model: phi4-reasoning:latest
    litellm_alias: phi4-reasoning-mini
    context: 4096
    timeout: 120
    max_parallel: 3

     # Gemma on M4 Mini (16GB), 32k context
  gemma-mac-mini:
    node: m4-mini-16g
    ollama_model: gemma4:12b-mlx
    litellm_alias: gemma4-12b-mlx-mini
    context: 32768
    timeout: 300
    max_parallel: 2

     # Gemma fallback on M4 Mini (16GB)
  gemma-mac-mini-vanilla:
    node: m4-mini-16g
    ollama_model: gemma4:latest
    litellm_alias: gemma4-latest-mini
    context: 32768
    timeout: 300
    max_parallel: 2

agents:
     # Planner → M4 Mini (64GB), qwen3.5:27b, 128k context
   planner:
     model: small-coder
     description: Use for planning, file discovery, task decomposition, and summarization.
     tools:
         - Read
         - Grep
         - Glob
     prompt: |
       You are a fast planning agent running on M4 Mac Mini (64GB).
       Do not edit files.
       Return a concise response with:
           - plan
           - relevant files
           - risks
           - next recommended agent

     # Implementer → M4 Mini (64GB), qwen3-coder, 256k context
   implementer:
     model: heavy-coder
     description: Use for implementation, bug fixes, refactors, and patch creation.
     tools:
         - Read
         - Grep
         - Glob
         - Edit
         - MultiEdit
         - Bash
     prompt: |
       You are a senior implementation agent running on M4 Mac Mini (64GB).
       Make minimal, correct changes.
       Prefer small patches.
       Run relevant checks when possible.
       Explain what changed and why.

     # Reviewer → Local MacBook, qwen3.6:35b-mlx, 32k context
   reviewer:
     model: heavy-coder-local
     description: Use after implementation to review diffs, tests, regressions, and maintainability.
     tools:
         - Read
         - Grep
         - Glob
         - Bash
     prompt: |
       You are a strict code reviewer running locally (MacBook).
       Focus on correctness, regressions, missing tests, security issues,
       over-engineering, and maintainability.
       Review the diff and test output.
       Return only actionable issues.

     # Analyst → M4 Mini (16GB), gemma4:12b-mlx, 32k context
   analyst:
     model: gemma-mac-mini
     description: Use for lightweight analysis, summarization, and data extraction.
     tools:
         - Read
         - Grep
         - Glob
     prompt: |
       You are a lightweight analyst agent running on M4 Mac Mini (16GB).
       Focus on concise summaries and structured outputs.
       Do not edit files.
       Return clear, actionable findings.
